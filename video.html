<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>演示视频 · 仙途</title>
<link rel="icon" href="src/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="src/assets/favicon.ico" sizes="any">
<link rel="stylesheet" href="src/styles/main.css">
<!--
  独立演示页。
  README 里放不了 B站播放器：GitHub 的 Markdown 有 HTML 白名单，<iframe> 会被
  转义成纯文本显示。GitHub Pages 不过滤 HTML，所以播放器只能放在这个页面里。
  仅用于线上站点，本地直接双击打开时 B站播放器可能因 file:// 协议无法加载。
-->
<style>
  .video-page {
    max-width: 960px;
    margin: 0 auto;
    padding: 40px 16px 56px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  .video-page .vp-title {
    font-family: var(--font-display);
    font-size: clamp(2rem, 7vw, 3rem);
    font-weight: normal;
    letter-spacing: 0.3em;
    text-indent: 0.3em;          /* 抵消字间距在末字右侧留下的空隙 */
    color: var(--text-main);
  }
  .video-page .vp-sub {
    font-size: 0.9rem;
    letter-spacing: 0.32em;
    text-indent: 0.32em;
    color: var(--text-muted);
  }

  /* 用 padding-top 撑出 16:9，比 aspect-ratio 兼容性更稳 */
  .player-frame {
    position: relative;
    width: 100%;
    padding-top: 56.25%;
    background: var(--border-dark);
    border: 1px solid var(--border-main);
    border-radius: var(--radius);
    box-shadow: 0 2px 12px rgba(61, 43, 31, 0.18);
    overflow: hidden;
  }
  .player-frame iframe {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }

  .vp-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    margin-top: 6px;
  }
  .vp-actions .btn {
    padding: 10px 30px;
    font-size: 1rem;
    letter-spacing: 0.18em;
    text-indent: 0.18em;
    text-decoration: none;
  }
  /* 提高优先级以盖过 main.css 的 .btn:hover */
  .btn.btn-primary {
    background-color: var(--accent);
    border-color: var(--accent-dark);
    color: var(--bg-panel);
  }
  .btn.btn-primary:hover { background-color: var(--accent-dark); }

  .vp-foot {
    margin-top: 10px;
    font-size: 0.82rem;
    letter-spacing: 0.12em;
    color: var(--text-muted);
    text-align: center;
  }
  .vp-foot a { color: var(--jade); }

  .vp-back {
    align-self: flex-start;
    font-size: 0.85rem;
    color: var(--text-muted);
    text-decoration: none;
    letter-spacing: 0.1em;
  }
  .vp-back:hover { color: var(--text-main); }
</style>
</head>
<body>

<div class="video-page">

  <a class="vp-back" href="./">← 返回游戏</a>

  <h1 class="vp-title">仙 途</h1>
  <p class="vp-sub">文字修仙 · 放置悟道</p>

  <div class="player-frame">
    <iframe
      src="https://player.bilibili.com/player.html?isOutside=true&amp;aid=117264451899766&amp;bvid=BV1zQYB6oES8&amp;cid=41862694648&amp;p=1"
      scrolling="no"
      border="0"
      frameborder="no"
      framespacing="0"
      allowfullscreen="true"
      title="仙途 · 演示视频"></iframe>
  </div>

  <div class="vp-actions">
    <a class="btn btn-primary" href="./">进入游戏</a>
    <a class="btn" href="https://www.bilibili.com/video/BV1zQYB6oES8" rel="noopener">在 B站打开</a>
  </div>

  <p class="vp-foot">
    纯前端 · 零依赖 · 零构建 · <a href="https://github.com/whouare-dot/xiantu" rel="noopener">开源（MIT）</a><br>
    无需安装，双击启动脚本即可游玩
  </p>

</div>

</body>
</html>
